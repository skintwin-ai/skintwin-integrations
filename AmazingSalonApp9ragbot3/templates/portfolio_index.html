
{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col-12">
            <h1>Digital Client Portfolio</h1>
            <p class="lead">View and manage client style history and transformations</p>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Select a Client</h5>
                </div>
                <div class="card-body">
                    <div class="row row-cols-1 row-cols-md-3 g-4">
                        {% for client in clients %}
                        <div class="col">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title">{{ client.name }}</h5>
                                    <p class="card-text">
                                        <small class="text-muted">{{ client.email }}</small><br>
                                        <small class="text-muted">{{ client.phone }}</small>
                                    </p>
                                </div>
                                <div class="card-footer">
                                    <a href="{{ url_for('portfolio.view_client_portfolio', client_id=client.id) }}" class="btn btn-info btn-sm">View Portfolio</a>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
