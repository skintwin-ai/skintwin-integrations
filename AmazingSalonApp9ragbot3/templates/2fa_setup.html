
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Set Up Two-Factor Authentication</h2>
    <div class="row">
        <div class="col-md-6">
            <p>Scan this QR code with your authenticator app:</p>
            <img src="https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl={{ qr_uri }}" alt="QR Code">
            <p>Or enter this code manually: <code>{{ secret }}</code></p>
            
            <form method="POST" action="{{ url_for('auth.verify_2fa') }}" class="mt-4">
                <div class="form-group">
                    <label for="code">Enter Verification Code:</label>
                    <input type="text" class="form-control" id="code" name="code" required>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Verify</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
