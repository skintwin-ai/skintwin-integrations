
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Book an Appointment</h2>
    <form action="{{ url_for('booking.create') }}" method="POST">
        <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Service</label>
            <select name="service" class="form-select" required>
                {% for service in services %}
                <option value="{{ service.id }}">{{ service.name }} - ${{ "%.2f"|format(service.price) }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Stylist</label>
            <select name="stylist_id" class="form-select" required>
                {% for stylist in stylists %}
                <option value="{{ stylist.id }}">{{ stylist.username }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Date and Time</label>
            <input type="datetime-local" name="date_time" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Book Appointment</button>
    </form>
</div>
{% endblock %}
